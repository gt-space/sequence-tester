name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/worker.js

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Download Python runtime
        run: npm install --no-save --prefix /tmp/sequence-pyodide pyodide@314.0.7
      - name: Package static site
        run: |
          mkdir -p site-dist/src
          cp index.html site-dist/
          cp src/app.js src/worker.js src/styles.css src/engine.py src/yjsplogo.png site-dist/src/
          cp -r /tmp/sequence-pyodide/node_modules/pyodide site-dist/src/pyodide
          sed -i "s|./src/app.js|./src/app.js?build=${GITHUB_SHA}|" site-dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
      - id: deployment
        uses: actions/deploy-pages@v4
