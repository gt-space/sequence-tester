name: Monitor Luna API compatibility

on:
  schedule:
    - cron: '37 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: luna-api-status
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Luna main (read only)
        run: git clone --depth=1 --branch=main https://github.com/gt-space/luna.git /tmp/luna-api
      - uses: dtolnay/rust-toolchain@stable
      - name: Install namespace test dependency
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Detect API drift without hiding failure
        id: drift
        shell: bash
        run: |
          if python scripts/check_luna_contract.py /tmp/luna-api > /tmp/luna-drift.txt 2>&1 && python scripts/generate_luna_contract.py /tmp/luna-api >> /tmp/luna-drift.txt 2>&1 && python -m unittest discover -s tests >> /tmp/luna-drift.txt 2>&1 && python3 scripts/audit_luna_drift.py /tmp/luna-api >> /tmp/luna-drift.txt 2>&1 && python3 scripts/test_production_binding.py /tmp/luna-api /tmp/luna-production-evidence >> /tmp/luna-drift.txt 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/luna-drift.txt
      - name: Publish independently refreshed public compatibility status
        shell: bash
        run: |
          upstream=$(git -C /tmp/luna-api rev-parse HEAD)
          if [ "${{ steps.drift.outputs.changed }}" = "true" ]; then compatible=false; else compatible=true; fi
          python scripts/write_luna_status.py --mode live --luna-sha "$upstream" --tester-sha "$GITHUB_SHA" --compatible "$compatible" --error-file /tmp/luna-drift.txt --output /tmp/luna-compatibility.json
          status_remote=$(git remote get-url origin)
          python3 scripts/publish_luna_status.py --remote "$status_remote" --status /tmp/luna-compatibility.json
      - name: Open a reviewable API sync PR if Luna changed
        if: steps.drift.outputs.changed == 'true'
        shell: bash
        run: |
          cp scripts/luna_bot.py /tmp/luna_bot.py
          python scripts/generate_luna_contract.py /tmp/luna-api --output /tmp/luna_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main
          git checkout -B automation/luna-api-drift origin/main
          cp /tmp/luna_contract.py src/luna_contract.py
          git add src/luna_contract.py
          if git diff --cached --quiet; then
            echo "Luna drift is not representable by an API-surface change; manual inspection required." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git commit -m "Regenerate Luna Python API contract for review"
          git push --force origin HEAD:refs/heads/automation/luna-api-drift
          python3 /tmp/luna_bot.py
      - name: Fail the monitor when drift or regressions were detected
        if: steps.drift.outputs.changed == 'true'
        run: exit 1
