name: Monitor Luna API compatibility

on:
  schedule:
    - cron: '37 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: luna-api-status
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Luna main (read only)
        run: git clone --depth=1 --branch=main https://github.com/gt-space/luna.git /tmp/luna-api
      - name: Detect API drift without hiding failure
        id: drift
        shell: bash
        run: |
          if python scripts/check_luna_contract.py /tmp/luna-api > /tmp/luna-drift.txt 2>&1 && python scripts/generate_luna_contract.py /tmp/luna-api >> /tmp/luna-drift.txt 2>&1 && python -m unittest discover -s tests >> /tmp/luna-drift.txt 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/luna-drift.txt
      - name: Publish independently refreshed public compatibility status
        shell: bash
        run: |
          upstream=$(git -C /tmp/luna-api rev-parse HEAD)
          if [ "${{ steps.drift.outputs.changed }}" = "true" ]; then compatible=false; else compatible=true; fi
          python scripts/write_luna_status.py --mode live --luna-sha "$upstream" --tester-sha "$GITHUB_SHA" --compatible "$compatible" --error-file /tmp/luna-drift.txt --output /tmp/luna-compatibility.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan publish-luna-status
          git rm -rf . >/dev/null
          cp /tmp/luna-compatibility.json status.json
          git add status.json
          git commit -m "Refresh Luna API compatibility status"
          git push --force origin HEAD:refs/heads/compatibility-status
      - name: Open a reviewable API sync PR if Luna changed
        if: steps.drift.outputs.changed == 'true'
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          git checkout -B automation/luna-api-drift origin/main
          python scripts/generate_luna_contract.py /tmp/luna-api --write
          git add src/luna_contract.py
          if git diff --cached --quiet; then
            echo "Luna drift is not representable by an API-surface change; manual inspection required." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git commit -m "Regenerate Luna Python API contract for review"
          git push --force origin HEAD:refs/heads/automation/luna-api-drift
          if [ "$(gh pr list --head automation/luna-api-drift --base main --state open --json number --jq 'length')" -eq 0 ]; then
            gh pr create --draft --base main --head automation/luna-api-drift \
              --title "chore: review upstream Luna API drift" \
              --body "Auto-generated downstream contract update from Luna main. **DO NOT MERGE** until simulated behavior and regression coverage are updated and CI passes. Luna is read-only. Review the latest Monitor Luna API compatibility action for the upstream SHA and drift reason."
          elif [ "$(gh pr view automation/luna-api-drift --json isDraft --jq '.isDraft')" != "true" ]; then
            gh pr ready automation/luna-api-drift --undo
          fi
      - name: Fail the monitor when drift or regressions were detected
        if: steps.drift.outputs.changed == 'true'
        run: exit 1
