name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *' # Detect API changes in Luna main every day

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout Luna API declarations
        run: git clone --depth=1 --branch=main https://github.com/gt-space/luna.git /tmp/luna-api
      - name: Verify contract against Luna main
        run: python scripts/check_luna_contract.py /tmp/luna-api
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/environment.js
          node --check src/filename.js
          node --check src/highlight.js
          node --check src/timeline.js
          node --check src/worker.js
          node --test tests/test_environment.mjs tests/test_filename.mjs tests/test_timeline.mjs
      - name: Install browser and Pyodide test runtime
        run: |
          npm install --no-save --prefix /tmp/sequence-browser playwright@1.56.1 pyodide@314.0.7
          /tmp/sequence-browser/node_modules/.bin/playwright install --with-deps chromium
          ln -s /tmp/sequence-browser/node_modules/pyodide src/pyodide
      - name: End-to-end Pyodide and plot cursor regression
        run: NODE_PATH=/tmp/sequence-browser/node_modules node tests/test_browser.cjs

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Download Python runtime
        run: npm install --no-save --prefix /tmp/sequence-pyodide pyodide@314.0.7
      - name: Package static site
        run: |
          mkdir -p site-dist/src
          cp index.html site-dist/
          cp src/app.js src/environment.js src/filename.js src/highlight.js src/timeline.js src/worker.js src/styles.css src/engine.py src/luna_contract.py src/luna_validation.py src/yjsplogo.png site-dist/src/
          cp -r /tmp/sequence-pyodide/node_modules/pyodide site-dist/src/pyodide
          sed -i "s|./src/app.js|./src/app.js?build=${GITHUB_SHA}|" site-dist/index.html
          sed -i "s|./src/styles.css|./src/styles.css?build=${GITHUB_SHA}|" site-dist/index.html
          sed -i "s|./highlight.js|./highlight.js?build=${GITHUB_SHA}|" site-dist/src/app.js
          sed -i "s|./environment.js|./environment.js?build=${GITHUB_SHA}|" site-dist/src/app.js
          sed -i "s|./filename.js|./filename.js?build=${GITHUB_SHA}|" site-dist/src/app.js
          sed -i "s|./timeline.js|./timeline.js?build=${GITHUB_SHA}|" site-dist/src/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
      - id: deployment
        uses: actions/deploy-pages@v4
